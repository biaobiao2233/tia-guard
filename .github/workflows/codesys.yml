name: CODESYS adapter contracts
on:
  push:
    paths: ['adapters/codesys/**', '.github/workflows/codesys.yml']
  pull_request:
    paths: ['adapters/codesys/**', '.github/workflows/codesys.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codesys-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adapters/codesys/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: adapters/codesys
      - run: npm test
        working-directory: adapters/codesys
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native script syntax only (not a compiler or runtime test)
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('adapters/codesys/native.py').read_text(encoding='utf-8'))"

